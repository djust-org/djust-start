name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      # Install exactly what uv.lock pins, the same set the djustlive rootfs
      # builder ships. An unlocked install pulled whatever djust was newest
      # and made CI test a different stack than production.
      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Run tests
        run: uv run --frozen pytest
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "True"
