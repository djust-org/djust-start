[project]
name = "djust-start"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "djust[theming,components]>=1.0.0rc13",
    "django>=5.2",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-django", "ruff", "watchdog"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
