[project]
name = "djust-start"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "djust[theming,components]>=1.0.0rc7",
    "django>=5.2",
    "daphne",
    "whitenoise",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-django", "ruff"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"
