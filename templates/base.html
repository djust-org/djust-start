{% load live_tags static %}
{% load theme_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My App{% endblock %}</title>
    {% theme_head %}
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.5rem; border-bottom: 1px solid currentColor;">
        <a href="/" style="font-weight: bold; text-decoration: none;">My App</a>
        {% theme_panel %}
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
