# Pre-commit hooks for djust-start.
#
# Install once:   make hooks      (or: .venv/bin/pre-commit install)
# Run manually:   make pre-commit (or: .venv/bin/pre-commit run --all-files)
#
# ruff + mypy run as `local` / `system` hooks pointing at the project venv,
# so they are the EXACT same tools (and versions) as `make lint` /
# `make typecheck` — no separate pinned copy to drift out of sync. Run
# `make install` first so the venv exists.
repos:
  # Generic file hygiene — self-contained, no project deps needed.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff (lint + autofix)
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff (format)
        entry: .venv/bin/ruff format
        language: system
        types: [python]
        require_serial: true

      - id: mypy
        name: mypy (django-stubs)
        entry: .venv/bin/mypy
        language: system
        types: [python]
        # mypy + django-stubs need whole-project context (settings module,
        # cross-module types), so run once over the configured `files`
        # scope rather than only the staged paths.
        pass_filenames: false
        require_serial: true
